name: WASL Docker Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (api, worker, dashboard, all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - api
          - worker
          - dashboard

env:
  registry: ${{ secrets.OCIR_REGISTRY }}
  username: ${{ secrets.OCIR_USERNAME }}
  password: ${{ secrets.OCIR_PASSWORD }}

jobs:
  generate-tag:
    runs-on: [ arc-amd64 ]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate dated tag
        id: tag
        run: |
          DATE_TAG=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          echo "image_tag=${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${DATE_TAG}-${SHORT_SHA}"

  build-api:
    needs: generate-tag
    if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'api' }}
    permissions:
      packages: write
    runs-on: [ arc-amd64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Clean up Docker to free disk space
        run: docker system prune -af --volumes || true

      - name: Create swap space
        run: |
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap enabled:"
          free -h

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ env.registry }}/wasl-op/op-api:${{ needs.generate-tag.outputs.image_tag }}
        run: |
          docker build \
            --build-arg DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" \
            --build-arg NODE_BUILD_MAX_MEMORY="2048" \
            -f "apps/api/Dockerfile" \
            -t "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"

  build-worker:
    needs: generate-tag
    if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'worker' }}
    permissions:
      packages: write
    runs-on: [ arc-amd64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Clean up Docker to free disk space
        run: docker system prune -af --volumes || true

      - name: Create swap space
        run: |
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap enabled:"
          free -h

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ env.registry }}/wasl-op/op-worker:${{ needs.generate-tag.outputs.image_tag }}
        run: |
          docker build \
            --build-arg DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy" \
            --build-arg NODE_BUILD_MAX_MEMORY="2048" \
            -f "apps/worker/Dockerfile" \
            -t "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"

  build-dashboard:
    needs: generate-tag
    if: ${{ github.event.inputs.app == 'all' || github.event.inputs.app == 'dashboard' }}
    permissions:
      packages: write
    runs-on: [ arc-amd64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Clean up Docker to free disk space
        run: docker system prune -af --volumes || true

      - name: Create swap space
        run: |
          sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap enabled:"
          free -h

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ env.username }}
          password: ${{ env.password }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ env.registry }}/wasl-op/op-dashboard:${{ needs.generate-tag.outputs.image_tag }}
        run: |
          docker build \
            --build-arg NO_CLOUDFLARE="1" \
            --build-arg NODE_BUILD_MAX_MEMORY="2048" \
            -f "apps/start/Dockerfile" \
            -t "$IMAGE_TAG" \
            .
          docker push "$IMAGE_TAG"
